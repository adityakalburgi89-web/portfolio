<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Kannada:wght@700;800;900&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: #222; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .footer-container { width: 100%; background: #F6E6C9; overflow: hidden; }
  .orange-strip { width: 100%; height: 38px; background: #D64D15; }
  .anatomy-panel { width: 100%; max-width: 950px; margin: 0 auto; padding: 0 0 20px 0; }
  .svg-canvas { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<footer class="footer-container">
  <div class="orange-strip"></div>
  <div class="anatomy-panel">
    <svg class="svg-canvas" viewBox="0 0 950 320" xmlns="http://www.w3.org/2000/svg">
      <!-- Anatomy Heading -->
      <text x="475" y="44" text-anchor="middle" fill="#580801" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="700" font-size="22">Anatomy</text>

      <!-- Guide Lines -->
      <!-- Head Line: y=117 -->
      <text x="25" y="120" fill="#B94318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Head Line</text>
      <line x1="88" y1="117" x2="925" y2="117" stroke="#E8AD8B" stroke-dasharray="6 5" stroke-width="1" />

      <!-- X-Height: y=139 -->
      <text x="25" y="142" fill="#B94318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">X-Height</text>
      <line x1="88" y1="139" x2="925" y2="139" stroke="#E8AD8B" stroke-dasharray="6 5" stroke-width="1" />

      <!-- Baseline: y=203 -->
      <text x="25" y="206" fill="#B94318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Baseline</text>
      <line x1="88" y1="203" x2="925" y2="203" stroke="#E8AD8B" stroke-dasharray="6 5" stroke-width="1" />

      <!-- Descender Line: y=232 -->
      <text x="25" y="235" fill="#B94318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Descender Line</text>
      <line x1="112" y1="232" x2="925" y2="232" stroke="#E8AD8B" stroke-dasharray="6 5" stroke-width="1" />

      <!-- Main Kannada Text -->
      <text x="545" y="203" text-anchor="middle" fill="#580801" font-family="'Noto Serif Kannada', serif" font-weight="900" font-size="84" letter-spacing="-1px">ನಮ್ಮ ಕನ್ನಡ</text>

      <!-- Circles -->
      <!-- Matra circle -->
      <circle cx="402" cy="130" r="17" fill="rgba(214, 77, 21, 0.22)" stroke="#D64D15" stroke-width="1.2" />
      <!-- Angular Terminal circle -->
      <circle cx="514" cy="143" r="19" fill="rgba(214, 77, 21, 0.22)" stroke="#D64D15" stroke-width="1.2" />

      <!-- Top Annotations -->
      <!-- Vashya -->
      <text x="265" y="73" text-anchor="middle" fill="#B94318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Vashya</text>
      <line x1="265" y1="80" x2="265" y2="117" stroke="#B94318" stroke-width="1" />

      <!-- Matra -->
      <text x="373" y="73" text-anchor="middle" fill="#B94318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Matra</text>
      <path d="M 373 80 L 373 105 L 392 116" fill="none" stroke="#B94318" stroke-width="1" />

      <!-- Angular Terminal -->
      <text x="512" y="73" text-anchor="middle" fill="#B94318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Angular Terminal</text>
      <line x1="512" y1="80" x2="512" y2="124" stroke="#B94318" stroke-width="1" />

      <!-- Loop -->
      <text x="643" y="73" text-anchor="middle" fill="#B94318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Loop</text>
      <line x1="643" y1="80" x2="643" y2="127" stroke="#B94318" stroke-width="1" />

      <!-- Shirorekha (Top Line) -->
      <text x="770" y="73" text-anchor="middle" fill="#B94318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Shirorekha (Top Line)</text>
      <line x1="762" y1="80" x2="762" y2="144" stroke="#B94318" stroke-width="1" />

      <!-- Bottom Annotations -->
      <!-- Bold Stem -->
      <line x1="366" y1="203" x2="366" y2="254" stroke="#B94318" stroke-width="1" />
      <text x="366" y="268" text-anchor="middle" fill="#B94318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Bold Stem</text>

      <!-- Counter -->
      <line x1="533" y1="203" x2="533" y2="254" stroke="#B94318" stroke-width="1" />
      <text x="533" y="268" text-anchor="middle" fill="#B94318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Counter</text>

      <!-- Tail -->
      <line x1="693" y1="232" x2="693" y2="254" stroke="#B94318" stroke-width="1" />
      <text x="693" y="268" text-anchor="middle" fill="#B94318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Tail</text>
    </svg>
  </div>
</footer>
</body>
</html>
