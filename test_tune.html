<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Kannada:wght@700;800;900&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #222; }
  .footer-container { width: 100%; background: #F6E6C9; }
  .orange-strip { width: 100%; height: 38px; background: #D64D15; }
  .anatomy-panel { width: 950px; margin: 0 auto; }
  .svg-canvas { width: 950px; height: 320px; display: block; }
</style>
</head>
<body>
<div class="footer-container">
  <div class="orange-strip"></div>
  <div class="anatomy-panel">
    <svg class="svg-canvas" viewBox="0 0 950 320" xmlns="http://www.w3.org/2000/svg">
      <text x="475" y="44" text-anchor="middle" fill="#580801" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="700" font-size="22">Anatomy</text>

      <text x="20" y="120" fill="#B94318" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Head Line</text>
      <line x1="82" y1="117" x2="925" y2="117" stroke="#E8AD8B" stroke-dasharray="6 5" stroke-width="1" />

      <text x="20" y="142" fill="#B94318" font-family="system-ui, sans-serif" font-size="11" font-weight="500">X-Height</text>
      <line x1="82" y1="139" x2="925" y2="139" stroke="#E8AD8B" stroke-dasharray="6 5" stroke-width="1" />

      <text x="20" y="206" fill="#B94318" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Baseline</text>
      <line x1="82" y1="203" x2="925" y2="203" stroke="#E8AD8B" stroke-dasharray="6 5" stroke-width="1" />

      <text x="20" y="235" fill="#B94318" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Descender Line</text>
      <line x1="105" y1="232" x2="925" y2="232" stroke="#E8AD8B" stroke-dasharray="6 5" stroke-width="1" />

      <text x="536" y="203" text-anchor="middle" fill="#580801" font-family="'Noto Serif Kannada', serif" font-weight="900" font-size="102" letter-spacing="0px">ನಮ್ಮ ಕನ್ನಡ</text>
    </svg>
  </div>
</div>
</body>
</html>
